<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .image-container {
      width: 100%;
      max-width: 750px;
    }

    .image-container img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>

<body>

  <div class="image-container">
    <img src="foto.jpg" alt="Gambar demo">
  </div>

</body>
</html>
